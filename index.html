<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jeremiah Bekoe's Password Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>


<div class="container">


    <h1>
        Generate a <br>
        <span>random password!</span>
    </h1>

    <p>Never use an insecure password again.</p>

    <!-- Length Selector -->
    <div class="setting">
        <label>Password Length: <span id="lengthValue">16</span></label>
        <input type="range" id="lengthSlider" min="6" max="32" value="16">
    </div>

    <!-- Options -->
    <div class="setting">
        <label><input type="checkbox" id="uppercase" checked> Uppercase</label>
        <label><input type="checkbox" id="lowercase" checked> Lowercase</label>
        <label><input type="checkbox" id="numbers" checked> Numbers</label>
        <label><input type="checkbox" id="symbols" checked> Symbols</label>
    </div>

    <!-- Gen button -->
    <button id="generateBtn">Generate Password</button>

    <!-- Strength Indicator -->
    <div class="strength">
        Strength: <span id="strengthText">Medium</span>
        <div class="strength-bar">
            <div id="strengthFill"></div>
        </div>
    </div>

    <!-- Password Output -->
    <div class="password-output">
        <input class="password-box" type="text" id="passwordField" readonly><br>
        <button id="copyBtn">Copy</button>
    </div>
    
    <h4>Created by Jeremiah Bekoe.</h4>

</div>

<script src="script.js"></script>
</body>
</html>
